<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="topbar">
        <h1 class="logo">My App</h1>
        <div class="topbar-actions">
            <button id="searchBtn" class="icon-btn" title="Search">🔍</button>
            <button id="themeBtn" class="icon-btn" title="Toggle Theme">🌙</button>
            <button id="logoutBtn" class="icon-btn" title="Logout">🚪</button>
        </div>
    </header>

    <!-- Search Box -->
    <div id="searchBox" class="search-container hidden">
        <input type="text" id="searchInput" placeholder="Search categories, headers, data...">
        <button id="clearSearch" class="small-btn">❌</button>
    </div>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Category Top Info -->
        <div class="header-row">
            <h2>Categories</h2>
            <span id="categoryCount">0টি Category</span>
            <button id="addCategoryBtn" class="primary-btn">＋ Category</button>
        </div>

        <!-- Category Grid / List -->
        <div id="categoryList" class="category-list"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">📁</div>
            <h2>কোনো Category পাওয়া যায়নি</h2>
            <p>নতুন একটি Category যোগ করে শুরু করুন।</p>
            <button id="emptyAddBtn" class="primary-btn">＋ Category তৈরি করুন</button>
        </div>

    </main>

    <!-- Modal 1: Category Create/Edit Modal -->
    <div id="categoryModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="categoryModalTitle">নতুন Category</h3>
            <input type="text" id="categoryNameInput" placeholder="Category Name..." autofocus>
            <div class="modal-actions">
                <button class="secondary-btn" data-close="categoryModal">বাতিল</button>
                <button id="saveCategoryBtn" class="primary-btn">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Category Details & Sub-Categories Modal -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <div>
                    <h2 id="detailsTitle">Category Name</h2>
                    <p id="detailsSubtitle" class="muted-text">0 Header • 0 Data</p>
                </div>
                <button class="icon-btn" data-close="detailsModal">✖</button>
            </div>

            <!-- Sub-Category, Header, Data Action Toolbar -->
            <div class="section-toolbar">
                <button id="addSubCategoryBtn" class="primary-btn">＋ Sub-Category</button>
                <button id="addHeaderBtn" class="primary-btn">＋ Header</button>
                <button id="addDataBtn" class="secondary-btn">＋ Data</button>
            </div>

            <!-- Details Dynamic Content Area -->
            <div id="detailsContent" class="details-content"></div>
        </div>
    </div>

    <!-- Modal 3: Header Modal -->
    <div id="headerModal" class="modal hidden">
        <div class="modal-content">
            <h3>নতুন Header</h3>
            <input type="text" id="headerNameInput" placeholder="Header Name...">
            <div class="modal-actions">
                <button class="secondary-btn" data-close="headerModal">বাতিল</button>
                <button id="saveHeaderBtn" class="primary-btn">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Modal 4: Data Modal -->
    <div id="dataModal" class="modal hidden">
        <div class="modal-content">
            <h3>নতুন Data যোগ করুন</h3>
            <label>Header সিলেক্ট করুন (ঐচ্ছিক):</label>
            <select id="dataHeaderSelect">
                <option value="">Header ছাড়া</option>
            </select>
            <input type="text" id="dataTitleInput" placeholder="Data Title...">
            <textarea id="dataDescriptionInput" placeholder="Data Description..."></textarea>
            <div class="modal-actions">
                <button class="secondary-btn" data-close="dataModal">বাতিল</button>
                <button id="saveDataBtn" class="primary-btn">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
