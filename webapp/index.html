<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook</title>
    
    <!-- External CSS with cache-bypassing version -->
    <link rel="stylesheet" href="style.css?v=1.2">

    <!-- Emergency Inline CSS Fix for Hidden & Modals -->
    <style>
        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-overlay.hidden {
            display: none !important;
        }

        .modal-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .modal-card {
            background: #1e293b;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Topbar Header -->
    <header class="topbar user-header">
        <div class="topbar-left">
            <button id="menuBtn" class="icon-btn" title="মেনু">☰</button>
            <h1 class="app-title">Police Phonebook</h1>
        </div>
        <div class="topbar-right">
            <button id="adminLoginBtn" class="admin-btn hidden">🔑 Admin</button>
            <button id="themeBtn" class="icon-btn" title="থিম পরিবর্তন">🌙</button>
            <button id="searchBtn" class="icon-btn" title="খুঁজুন">🔍</button>
        </div>
    </header>

    <!-- Search Box -->
    <div id="searchBox" class="search-container hidden">
        <input type="text" id="searchInput" placeholder="নাম, পদবী বা ফোন দিয়ে খুঁজুন...">
        <button id="clearSearch" class="clear-btn">✕</button>
    </div>

    <!-- Main App Container -->
    <main class="app-container">

        <!-- Main Dashboard View -->
        <section id="mainDashboardView" class="view-section">
            <div class="section-header">
                <h2>ক্যাটাগরি সমূহ</h2>
                <button id="addCategoryBtn" class="btn-primary admin-only hidden">+ ক্যাটাগরি</button>
            </div>
            <div id="categoryList" class="grid-container"></div>
            <div id="emptyState" class="empty-state hidden">
                <p>কোনো ক্যাটাগরি পাওয়া যায়নি!</p>
                <button id="emptyAddBtn" class="btn-primary admin-only hidden">+ প্রথম ক্যাটাগরি তৈরি করুন</button>
            </div>
        </section>

        <!-- Category Details View -->
        <section id="categoryDetailsView" class="view-section hidden">
            <div class="details-topbar">
                <button id="backToMainBtn" class="btn-back">← পেছনে যান</button>
                <h2 id="detailsTitle">ক্যাটাগরি ডিটেইলস</h2>
            </div>
            
            <div class="admin-action-bar admin-only hidden">
                <button id="addSubCategoryBtn" class="btn-secondary">+ Sub-Category</button>
                <button id="addHeaderBtn" class="btn-secondary">+ Header</button>
                <button id="addDataBtn" class="btn-primary">+ Data</button>
            </div>

            <div id="detailsContent" class="details-content-container"></div>
        </section>

        <!-- Single Data Details View -->
        <section id="dataDetailsView" class="view-section hidden">
            <div class="details-topbar">
                <button id="backFromDataBtn" class="btn-back">← পেছনে যান</button>
            </div>
            <div id="dataPageContent" class="data-page-container"></div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Modals -->

    <!-- Admin Login Modal -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Admin Login</h3>
            <div id="loginFormContainer">
                <input type="email" id="loginEmail" placeholder="ইমেইল দিন" class="form-control">
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড দিন" class="form-control">
                <div class="modal-actions">
                    <button class="btn-secondary" data-close="loginModal">বাতিল</button>
                    <button id="submitLoginBtn" class="btn-primary">লগইন</button>
                </div>
            </div>
            <div id="logoutContainer" class="hidden">
                <p>আপনি অ্যাডমিন হিসেবে লগইন আছেন।</p>
                <div class="modal-actions">
                    <button class="btn-secondary" data-close="loginModal">বন্ধ করুন</button>
                    <button id="logoutBtn" class="btn-danger">লগআউট</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="categoryModalTitle">ক্যাটাগরি সেভ করুন</h3>
            <input type="text" id="categoryNameInput" placeholder="ক্যাটাগরির নাম" class="form-control">
            <div class="modal-actions">
                <button class="btn-secondary" data-close="categoryModal">বাতিল</button>
                <button id="saveCategoryBtn" class="btn-primary">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Header Modal -->
    <div id="headerModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Header সেভ করুন</h3>
            <input type="text" id="headerNameInput" placeholder="হেডার শিরোনাম" class="form-control">
            <div class="modal-actions">
                <button class="btn-secondary" data-close="headerModal">বাতিল</button>
                <button id="saveHeaderBtn" class="btn-primary">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Data Modal -->
    <div id="dataModal" class="modal-overlay hidden">
        <div class="modal-card modal-large">
            <h3 id="dataModalTitle">Data সেভ করুন</h3>
            <div class="form-grid">
                <input type="text" id="dataPhoto" placeholder="ছবির URL (ঐচ্ছিক)" class="form-control">
                <input type="text" id="dataName" placeholder="নাম (*)" class="form-control">
                <input type="text" id="dataMobile" placeholder="মোবাইল নম্বর" class="form-control">
                <input type="text" id="dataPhone" placeholder="টেলিফোন নম্বর" class="form-control">
                <input type="text" id="dataDesignation" placeholder="পদবী" class="form-control">
                <input type="email" id="dataEmail" placeholder="ইমেইল ঠিকানা" class="form-control">
                <input type="text" id="dataCurrentOffice" placeholder="বর্তমান কর্মস্থল/ঠিকানা" class="form-control">
                <input type="text" id="dataPermanentAddress" placeholder="স্থায়ী ঠিকানা" class="form-control">
                <textarea id="dataAdminInfo" placeholder="প্রশাসনিক তথ্য (Admin Only)" class="form-control"></textarea>
                <select id="dataHeaderSelect" class="form-control">
                    <option value="">Header ছাড়া</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" data-close="dataModal">বাতিল</button>
                <button id="saveDataBtn" class="btn-primary">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Move Data Modal -->
    <div id="moveDataModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Data স্থানান্তর করুন</h3>
            <label>নতুন ক্যাটাগরি:</label>
            <select id="moveCategorySelect" class="form-control"></select>
            <label style="margin-top:10px; display:block;">নতুন হেডার (ঐচ্ছিক):</label>
            <select id="moveHeaderSelect" class="form-control"></select>
            <div class="modal-actions">
                <button class="btn-secondary" data-close="moveDataModal">বাতিল</button>
                <button id="confirmMoveBtn" class="btn-primary">মুভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="color:#ef4444;">⚠️ ডিলিট নিশ্চিতকরণ</h3>
            <p id="deleteModalText" style="margin: 15px 0; color: var(--text-color, #333);">আপনি কি নিশ্চিত এটি মুছে ফেলতে চান?</p>
            <div class="modal-actions">
                <button id="cancelDeleteBtn" class="btn-secondary">বাতিল</button>
                <button id="confirmDeleteBtn" class="btn-danger" style="background-color:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">মুছে ফেলুন</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=1.2"></script>
</body>
</html>
