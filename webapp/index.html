<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Police Phonebook">

    <title>Police Phonebook</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json?v=1.1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>

<header class="topbar">
    <!-- Combined Menu and Back Button -->
    <button id="navToggleBtn" class="icon-btn" type="button" title="মেনু">
        <span id="menuIcon">☰</span>
        <span id="backIcon" class="hidden">←</span>
    </button>

    <div class="app-title" id="appTitle">
        <span class="app-title-text">Police Phonebook</span>
    </div>

    <!-- Header Search Box -->
    <div id="searchBox" class="header-search-box hidden">
        <input type="search" id="searchInput" placeholder="Category, Header অথবা Data খুঁজুন..." autocomplete="off">
    </div>

    <div class="top-actions" id="topActions">
        <button id="adminLoginBtn" class="primary-btn active-btn btn-admin-small hidden" type="button">🔑 Admin</button>
        <button id="themeBtn" class="icon-btn" title="নাইট/ডে মোড" type="button">🌙</button>
        <button id="searchBtn" class="icon-btn" title="সার্চ করুন" type="button">🔍</button>
    </div>
</header>

<main class="container">
    <!-- Page 1: Main Dashboard -->
    <div id="mainDashboardView">
        <!-- All Search Button under Topbar -->
        <div class="all-search-wrapper">
            <button id="allSearchBtn" class="topbar-search-btn" type="button" title="সব খুঁজুন">🌐 All Search</button>
        </div>

        <section class="dashboard-header">
            <button id="addCategoryBtn" class="primary-btn admin-only" type="button" style="width:100%; margin-top:8px;">＋ Category</button>
        </section>

        <!-- Categories List -->
        <section id="categoryList" class="category-list"></section>

        <!-- All Search View Container -->
        <div id="allSearchContainer" class="hidden" style="margin-top: 15px;"></div>

        <!-- Empty State -->
        <section id="emptyState" class="empty-state hidden">
            <div class="empty-icon">📂</div>
            <h2>এখনো কোনো Category নেই</h2>
            <p>ডাটা দেখতে অপেক্ষা করুন, প্রয়োজনে রিফ্রেস করুন।</p>
            <button id="emptyAddBtn" class="primary-btn admin-only" type="button">＋ প্রথম Category তৈরি করুন</button>
        </section>
    </div>

    <!-- Page 2: Category Details -->
    <div id="categoryDetailsView" class="hidden">
        <section class="dashboard-header">
            <div class="header-left">
                <button id="backToMainBtn" class="secondary-btn" type="button">← পেছনে যান</button>
                <div>
                    <h1 id="detailsTitle">Category</h1>
                    <p id="detailsSubtitle"></p>
                </div>
            </div>
        </section>

        <!-- Admin Toolbar -->
        <div class="section-toolbar admin-only">
            <button id="addSubCategoryBtn" class="primary-btn" type="button">＋ Sub-Category</button>
            <button id="addHeaderBtn" class="primary-btn" type="button">＋ Header</button>
            <button id="addDataBtn" class="secondary-btn" type="button">＋ Data</button>
        </div>

        <!-- Category Details -->
        <div id="detailsContent"></div>
    </div>

    <!-- Page 3: Data Details -->
    <div id="dataDetailsView" class="hidden">
        <section class="dashboard-header">
            <button id="backFromDataBtn" class="secondary-btn" type="button">← পেছনে যান</button>
        </section>

        <div class="details-container-card">
            <div id="dataPageContent"></div>
        </div>
    </div>
</main>

<!-- Modals -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Admin Login</h2>
            <button class="close-btn" data-close="loginModal" type="button">✕</button>
        </div>
        <div id="loginFormContainer">
            <div class="form-group">
                <label>ইমেইল</label>
                <input id="loginEmail" type="email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input id="loginPassword" type="password" placeholder="******">
            </div>
            <div class="modal-actions">
                <button class="secondary-btn" data-close="loginModal" type="button">বাতিল</button>
                <button id="submitLoginBtn" class="primary-btn" type="button">লগইন</button>
            </div>
        </div>
        <div id="logoutContainer" class="hidden logout-box">
            <p class="status-ok">✅ আপনি অ্যাডমিন হিসেবে লগইন আছেন</p>
            <div class="modal-actions">
                <button class="secondary-btn" data-close="loginModal" type="button">বন্ধ করুন</button>
                <button id="logoutBtn" class="danger-btn" type="button">লগআউট</button>
            </div>
        </div>
    </div>
</div>

<!-- Category Modal -->
<div id="categoryModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="categoryModalTitle">নতুন Category</h2>
            <button class="close-btn" data-close="categoryModal" type="button">✕</button>
        </div>
        <div class="form-group">
            <label>Category Name</label>
            <input id="categoryNameInput" type="text" placeholder="যেমন: পুলিশ হেডকোয়ার্টার্স">
        </div>
        <div class="modal-actions">
            <button class="secondary-btn" data-close="categoryModal" type="button">বাতিল</button>
            <button id="saveCategoryBtn" class="primary-btn" type="button">সেভ করুন</button>
        </div>
    </div>
</div>

<!-- Header Modal -->
<div id="headerModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="headerModalTitle">নতুন Header</h2>
            <button class="close-btn" data-close="headerModal" type="button">✕</button>
        </div>
        <div class="form-group">
            <label>Header Title</label>
            <input id="headerNameInput" type="text" placeholder="যেমন: অফিসারবৃন্দ">
        </div>
        <div class="modal-actions">
            <button class="secondary-btn" data-close="headerModal" type="button">বাতিল</button>
            <button id="saveHeaderBtn" class="primary-btn" type="button">সেভ করুন</button>
        </div>
    </div>
</div>

<!-- Data Modal -->
<div id="dataModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="dataModalTitle">Data যোগ করুন</h2>
            <button class="close-btn" data-close="dataModal" type="button">✕</button>
        </div>

        <div class="form-group">
            <label>ছবি URL (ঐচ্ছিক)</label>
            <input id="dataPhoto" type="url" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="form-group">
            <label>Header সিলেক্ট করুন (ঐচ্ছিক)</label>
            <select id="dataHeaderSelect"></select>
        </div>

        <div class="form-group">
            <label>নাম *</label>
            <input id="dataName" type="text" placeholder="যেমন: মোঃ রফিকুল ইসলাম">
        </div>

        <div class="form-group">
            <label>মোবাইল *</label>
            <input id="dataMobile" type="tel" placeholder="01711000000">
        </div>

        <div class="form-group">
            <label>টেলিফোন</label>
            <input id="dataPhone" type="tel" placeholder="029999999">
        </div>

        <div class="form-group">
            <label>পদবী</label>
            <input id="dataDesignation" type="text" placeholder="যেমন: আইজিপি">
        </div>

        <div class="form-group">
            <label>ইমেইল</label>
            <input id="dataEmail" type="email" placeholder="example@police.gov.bd">
        </div>

        <div class="form-group">
            <label>বর্তমান কর্মস্থল</label>
            <input id="dataCurrentOffice" type="text" placeholder="যেমন: পুলিশ হেডকোয়ার্টার্স, ঢাকা">
        </div>

        <div class="form-group">
            <label>স্থায়ী ঠিকানা</label>
            <input id="dataPermanentAddress" type="text" placeholder="যেমন: ধানমন্ডি, ঢাকা">
        </div>

        <div class="form-group">
            <label>অ্যাডমিন তথ্য (শুধুমাত্র এডমিন দেখবেন)</label>
            <textarea id="dataAdminInfo" placeholder="গোপনীয় নোট..."></textarea>
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="dataModal" type="button">বাতিল</button>
            <button id="saveDataBtn" class="primary-btn" type="button">সেভ করুন</button>
        </div>
    </div>
</div>

<!-- Move Data Modal -->
<div id="moveDataModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Data মুভ করুন</h2>
            <button class="close-btn" data-close="moveDataModal" type="button">✕</button>
        </div>
        <div class="form-group">
            <label>টার্গেট Category সিলেক্ট করুন</label>
            <select id="moveCategorySelect"></select>
        </div>
        <div class="form-group">
            <label>টার্গেট Header সিলেক্ট করুন (ঐচ্ছিক)</label>
            <select id="moveHeaderSelect"></select>
        </div>
        <div class="modal-actions">
            <button class="secondary-btn" data-close="moveDataModal" type="button">বাতিল</button>
            <button id="confirmMoveBtn" class="primary-btn" type="button">Move করুন</button>
        </div>
    </div>
</div>

<div id="customConfirmModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="confirmModalTitle">নিশ্চিতকরণ</h2>
            <button class="close-btn" data-close="customConfirmModal" type="button">✕</button>
        </div>
        <div style="padding: 15px 0;">
            <p id="confirmModalMessage" style="font-size: 16px; color: var(--text-color);">আপনি কি নিশ্চিত?</p>
        </div>
        <div class="modal-actions">
            <button id="cancelConfirmBtn" class="secondary-btn" type="button">বাতিল</button>
            <button id="okConfirmBtn" class="danger-btn" type="button">হ্যাঁ, মুছুন</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- JavaScript -->
<script type="module" src="js/app.js"></script>

<!-- Service Worker Registration -->
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js?v=3.1")
            .then(function (registration) {
                console.log("PWA Service Worker registered:", registration.scope);
            })
            .catch(function (error) {
                console.error("PWA Registration failed:", error);
            });
    });
}
</script>
</body>
</html>
