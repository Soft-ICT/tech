<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Data Manager</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body.dark-mode {
            background-color: #121212 !important;
            color: #ffffff !important;
            --card-bg: #1e1e1e;
        }
        body.dark-mode .topbar,
        body.dark-mode .modal-content,
        body.dark-mode .category-card,
        body.dark-mode .data-card-item {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border-color: #333333 !important;
        }
        body.dark-mode input,
        body.dark-mode textarea,
        body.dark-mode select {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
        body.dark-mode .secondary-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
        }

        /* Data Card Category-like styling */
        .data-card-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .data-card-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .data-card-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .details-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            background: #e2e8f0;
        }
    </style>
</head>

<body>

<header class="topbar">

    <button id="menuBtn" class="icon-btn">☰</button>

    <div class="app-title">
        <span>📚</span>
        <span>My Data Manager</span>
    </div>

    <div class="top-actions" style="display: flex; gap: 8px; align-items: center;">
        <button id="adminLoginBtn" class="primary-btn" style="padding: 6px 12px; font-size: 13px;">
            🔑 Admin Login
        </button>
        <button id="themeBtn" class="icon-btn" title="নাইট/ডে মোড">🌙</button>
        <button id="searchBtn" class="icon-btn" title="সার্চ করুন">🔍</button>
    </div>

</header>


<main class="container">

    <!-- Search Box -->
    <section id="searchBox" class="search-box hidden">
        <input type="search" id="searchInput" placeholder="Category, Header অথবা Data খুঁজুন..." autocomplete="off">
        <button id="clearSearch">✕</button>
    </section>

    <!-- Page 1: Main Dashboard View -->
    <div id="mainDashboardView">
        <section class="dashboard-header">
            <div>
                <h1>আমার Categories</h1>
                <p id="categoryCount">0টি Category</p>
            </div>
            <button id="addCategoryBtn" class="primary-btn admin-only">＋ Category</button>
        </section>

        <!-- Categories List -->
        <section id="categoryList" class="category-list"></section>

        <!-- Empty State -->
        <section id="emptyState" class="empty-state">
            <div class="empty-icon">📂</div>
            <h2>এখনো কোনো Category নেই</h2>
            <p>ডাটা দেখতে অপেক্ষা করুন অথবা এডমিন হিসেবে লগইন করুন।</p>
            <button id="emptyAddBtn" class="primary-btn admin-only">＋ প্রথম Category তৈরি করুন</button>
        </section>
    </div>

    <!-- Page 2: Category Details Full Page View -->
    <div id="categoryDetailsView" class="hidden">
        <section class="dashboard-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="backToMainBtn" class="secondary-btn">← ব্যাকে যান</button>
                <div>
                    <h1 id="detailsTitle">Category</h1>
                    <p id="detailsSubtitle"></p>
                </div>
            </div>
        </section>

        <div class="section-toolbar admin-only" style="margin-bottom: 20px;">
            <button id="addSubCategoryBtn" class="primary-btn">＋ Sub-Category</button>
            <button id="addHeaderBtn" class="primary-btn">＋ Header</button>
            <button id="addDataBtn" class="secondary-btn">＋ Data</button>
        </div>

        <div id="detailsContent"></div>
    </div>

</main>


<!-- Admin Login Modal -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Admin Login</h2>
            <button class="close-btn" data-close="loginModal">✕</button>
        </div>

        <div id="loginFormContainer">
            <div class="form-group">
                <label>ইমেইল</label>
                <input id="loginEmail" type="email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input id="loginPassword" type="password" placeholder="******">
            </div>
            <div class="modal-actions">
                <button class="secondary-btn" data-close="loginModal">বাতিল</button>
                <button id="submitLoginBtn" class="primary-btn">লগইন</button>
            </div>
        </div>

        <div id="logoutContainer" class="hidden" style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; text-align: center;">
            <p style="margin-bottom: 10px; color: #28a745;">✅ আপনি অ্যাডমিন হিসেবে লগইন আছেন</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="secondary-btn" data-close="loginModal">বাতিল</button>
                <button id="logoutBtn" class="secondary-btn" style="background-color: #dc3545; color: #ffffff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer;">
                    🚪 লগআউট
                </button>
            </div>
        </div>
    </div>
</div>


<!-- Category Modal -->
<div id="categoryModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="categoryModalTitle">নতুন Category</h2>
            <button class="close-btn" data-close="categoryModal">✕</button>
        </div>
        <div class="form-group">
            <label>Category Name</label>
            <input id="categoryNameInput" type="text" placeholder="যেমন: পুলিশ কর্মকর্তা" maxlength="100">
        </div>
        <div class="modal-actions">
            <button class="secondary-btn" data-close="categoryModal">বাতিল</button>
            <button id="saveCategoryBtn" class="primary-btn">Save</button>
        </div>
    </div>
</div>


<!-- Header Modal -->
<div id="headerModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>নতুন Header</h2>
            <button class="close-btn" data-close="headerModal">✕</button>
        </div>
        <div class="form-group">
            <label>Header Name</label>
            <input id="headerNameInput" type="text" placeholder="যেমন: জরুরি যোগাযোগ" maxlength="100">
        </div>
        <div class="modal-actions">
            <button class="secondary-btn" data-close="headerModal">বাতিল</button>
            <button id="saveHeaderBtn" class="primary-btn">Save</button>
        </div>
    </div>
</div>


<!-- Data Modal (With Photo Field) -->
<div id="dataModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="dataModalTitle">Data যোগ করুন</h2>
            <button class="close-btn" data-close="dataModal">✕</button>
        </div>

        <div class="form-group">
            <label>ছবি (Image URL / Link)</label>
            <input type="url" id="dataPhoto" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="form-group">
            <label>নাম</label>
            <input type="text" id="dataName" placeholder="নাম লিখুন">
        </div>

        <div class="form-group">
            <label>পদবী</label>
            <input type="text" id="dataDesignation" placeholder="পদবী লিখুন">
        </div>

        <div class="form-group">
            <label>মোবাইল</label>
            <input type="text" id="dataMobile" placeholder="মোবাইল নম্বর লিখুন">
        </div>

        <div class="form-group">
            <label>টেলিফোন</label>
            <input type="text" id="dataPhone" placeholder="টেলিফোন নম্বর লিখুন">
        </div>

        <div class="form-group">
            <label>ই-মেইল</label>
            <input type="email" id="dataEmail" placeholder="ই-মেইল ঠিকানা লিখুন">
        </div>

        <div class="form-group">
            <label>বর্তমানে কর্মরত (বর্তমান ঠিকানা)</label>
            <input type="text" id="dataCurrentOffice" placeholder="বর্তমান ঠিকানা / কর্মস্থল লিখুন">
        </div>

        <div class="form-group">
            <label>স্থায়ী ঠিকানা</label>
            <textarea id="dataPermanentAddress" rows="2" placeholder="স্থায়ী ঠিকানা লিখুন"></textarea>
        </div>

        <div class="form-group">
            <label>প্রশাসনিক তথ্য</label>
            <textarea id="dataAdminInfo" rows="2" placeholder="প্রশাসনিক তথ্য লিখুন"></textarea>
        </div>

        <div class="form-group">
            <label>Header</label>
            <select id="dataHeaderSelect">
                <option value="">Header ছাড়া</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="dataModal">বাতিল</button>
            <button id="saveDataBtn" class="primary-btn">Save</button>
        </div>
    </div>
</div>


<!-- Data Full Details Modal (Open on Click) -->
<div id="dataDetailsModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>সম্পূর্ণ তথ্য</h2>
            <button class="close-btn" data-close="dataDetailsModal">✕</button>
        </div>

        <div id="detailsModalBody" style="padding: 10px 0;">
            <!-- Dynamic Details Injection -->
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="dataDetailsModal">বন্ধ করুন</button>
        </div>
    </div>
</div>


<!-- Fast Move Data Modal -->
<div id="moveDataModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Data সরান (Move Data)</h2>
            <button class="close-btn" data-close="moveDataModal">✕</button>
        </div>

        <div class="form-group">
            <label>গন্তব্য Category বেছে নিন</label>
            <select id="moveCategorySelect"></select>
        </div>

        <div class="form-group">
            <label>গন্তব্য Header বেছে নিন</label>
            <select id="moveHeaderSelect"></select>
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="moveDataModal">বাতিল</button>
            <button id="confirmMoveBtn" class="primary-btn">Move করুন</button>
        </div>
    </div>
</div>


<!-- Toast -->
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
