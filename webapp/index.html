<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Police Phonebook - Dynamic Header</title>
  
  <!-- Font Awesome Icons for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
    }

    /* Header Main Container */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0d233a; /* Police Theme Blue */
      color: #ffffff;
      height: 60px;
      padding: 0 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    /* Left Menu / Back Icon Area */
    .icon-left {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 20px;
      cursor: pointer;
    }

    /* Title Area */
    .header-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }

    /* Search Bar Area */
    .search-wrapper {
      flex: 1;
      margin: 0 10px;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #333333;
    }

    /* Right Action Icon Area */
    .icon-right {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 18px;
      cursor: pointer;
    }

    /* Helper Utility Class to Hide Elements */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Header Start -->
  <header class="app-header">
    
    <!-- Left Icon (Toggles Menu <-> Back) -->
    <div class="icon-left" id="btn-left-icon">
      <i class="fa-solid fa-bars" id="icon-menu"></i>
      <i class="fa-solid fa-arrow-left hidden" id="icon-back"></i>
    </div>

    <!-- Title (Hides when search is active) -->
    <h1 class="header-title" id="title-text">Police Phonebook</h1>

    <!-- Search Input (Shows when search is active) -->
    <div class="search-wrapper hidden" id="search-box">
      <input type="text" class="search-input" id="search-input" placeholder="খুঁজুন (নাম বা নম্বর)...">
    </div>

    <!-- Right Icon (Search Button) -->
    <div class="icon-right" id="btn-search-trigger">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

  </header>
  <!-- Header End -->

  <!-- JavaScript logic -->
  <script>
    // DOM Elements selection
    const iconMenu = document.getElementById('icon-menu');
    const iconBack = document.getElementById('icon-back');
    const titleText = document.getElementById('title-text');
    const searchBox = document.getElementById('search-box');
    const searchInput = document.getElementById('search-input');
    const btnSearchTrigger = document.getElementById('btn-search-trigger');
    const btnLeftIcon = document.getElementById('btn-left-icon');

    // Activate Search Mode
    btnSearchTrigger.addEventListener('click', () => {
      // Hide title and menu icon
      titleText.classList.add('hidden');
      iconMenu.classList.add('hidden');

      // Show search bar and back icon
      searchBox.classList.remove('hidden');
      iconBack.classList.remove('hidden');

      // Auto focus on input box
      searchInput.focus();
    });

    // Reset to Default Mode (Clicking Back Icon)
    btnLeftIcon.addEventListener('click', () => {
      // Check if Back Icon is visible before triggering reset
      if (!iconBack.classList.contains('hidden')) {
        // Show title and menu icon
        titleText.classList.remove('hidden');
        iconMenu.classList.remove('hidden');

        // Hide search bar and back icon
        searchBox.classList.add('hidden');
        iconBack.classList.add('hidden');

        // Clear input value
        searchInput.value = '';
      }
    });
  </script>

</body>
</html>
