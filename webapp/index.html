<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook & Directory</title>

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">

    <!-- CSS (আপনার প্রজেক্টের CSS ফাইল লিংক এখানে দিন) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main App UI Container -->
    <div id="app">
        <!-- Topbar / Header -->
        <header class="topbar">
            <h1>Police Phonebook</h1>
            <div class="actions">
                <button id="searchBtn">🔍</button>
                <button id="themeBtn">🌙</button>
                <button id="adminLoginBtn">🔑 Admin</button>
            </div>
        </header>

        <!-- Search Box -->
        <div id="searchBox" class="hidden">
            <input type="text" id="searchInput" placeholder="খুঁজুন (নাম, মোবাইল, পদবী)...">
            <button id="clearSearch">❌</button>
        </div>

        <!-- Main Dashboard View -->
        <main id="mainDashboardView">
            <div class="category-header">
                <h2>ক্যাটাগরি সমূহ</h2>
                <span id="categoryCount">0টি Category</span>
            </div>

            <div id="categoryList" class="category-grid"></div>

            <div id="emptyState" class="hidden">
                <p>কোনো ক্যাটাগরি পাওয়া যায়নি!</p>
                <button id="emptyAddBtn" class="primary-btn admin-only hidden">+ নতুন ক্যাটাগরি</button>
            </div>
        </main>

        <!-- Category Details View -->
        <section id="categoryDetailsView" class="hidden">
            <div class="view-header">
                <button id="backToMainBtn" class="back-btn">⬅️ ফিরে যান</button>
                <div>
                    <h2 id="detailsTitle"></h2>
                    <p id="detailsSubtitle"></p>
                </div>
            </div>

            <div class="admin-actions admin-only hidden">
                <button id="addSubCategoryBtn" class="secondary-btn">+ Sub-Category</button>
                <button id="addHeaderBtn" class="secondary-btn">+ Header</button>
                <button id="addDataBtn" class="primary-btn">+ Data</button>
            </div>

            <div id="detailsContent"></div>
        </section>

        <!-- Single Data Details View -->
        <section id="dataDetailsView" class="hidden">
            <div class="view-header">
                <button id="backFromDataBtn" class="back-btn">⬅️ ফিরে যান</button>
                <h2>কন্টাক্ট ডিটেইলস</h2>
            </div>
            <div id="dataPageContent"></div>
        </section>
    </div>


    <!-- ================= MODALS ================= -->

    <!-- Category Modal -->
    <div id="categoryModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="categoryModalTitle">নতুন Category</h3>
            <input type="text" id="categoryNameInput" placeholder="Category-এর নাম লিখুন">
            <div class="modal-actions">
                <button class="secondary-btn" data-close="categoryModal" type="button">বাতিল</button>
                <button id="saveCategoryBtn" class="primary-btn" type="button">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Header Modal -->
    <div id="headerModal" class="modal hidden">
        <div class="modal-content">
            <h3>Header নাম দিন</h3>
            <input type="text" id="headerNameInput" placeholder="Header-এর নাম লিখুন">
            <div class="modal-actions">
                <button class="secondary-btn" data-close="headerModal" type="button">বাতিল</button>
                <button id="saveHeaderBtn" class="primary-btn" type="button">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Data Modal -->
    <div id="dataModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="dataModalTitle">Data যোগ করুন</h3>
            <input type="text" id="dataPhoto" placeholder="ছবি URL (ঐচ্ছিক)">
            <input type="text" id="dataName" placeholder="নাম">
            <input type="text" id="dataMobile" placeholder="মোবাইল">
            <input type="text" id="dataPhone" placeholder="টেলিফোন">
            <input type="text" id="dataDesignation" placeholder="পদবী">
            <input type="email" id="dataEmail" placeholder="ই-মেইল">
            <input type="text" id="dataCurrentOffice" placeholder="বর্তমান ঠিকানা">
            <input type="text" id="dataPermanentAddress" placeholder="স্থায়ী ঠিকানা">
            <textarea id="dataAdminInfo" placeholder="প্রশাসনিক তথ্য"></textarea>
            
            <label>Header নির্বাচন করুন:
                <select id="dataHeaderSelect"></select>
            </label>

            <div class="modal-actions">
                <button class="secondary-btn" data-close="dataModal" type="button">বাতিল</button>
                <button id="saveDataBtn" class="primary-btn" type="button">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Move Data Modal -->
    <div id="moveDataModal" class="modal hidden">
        <div class="modal-content">
            <h3>ডাটা স্থানান্তরিত করুন</h3>
            <label>নতুন Category:
                <select id="moveCategorySelect"></select>
            </label>
            <label>নতুন Header:
                <select id="moveHeaderSelect"></select>
            </label>

            <div class="modal-actions">
                <button class="secondary-btn" data-close="moveDataModal" type="button">বাতিল</button>
                <button id="confirmMoveBtn" class="primary-btn" type="button">Move করুন</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <div id="loginFormContainer">
                <h3>Admin লগইন</h3>
                <input type="email" id="loginEmail" placeholder="ইমেইল">
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
                <div class="modal-actions">
                    <button class="secondary-btn" data-close="loginModal" type="button">বাতিল</button>
                    <button id="submitLoginBtn" class="primary-btn" type="button">লগইন</button>
                </div>
            </div>
            <div id="logoutContainer" class="hidden">
                <h3>অ্যাডমিন প্যানেল</h3>
                <p>আপনি বর্তমানে লগইন অবস্থায় আছেন।</p>
                <div class="modal-actions">
                    <button class="secondary-btn" data-close="loginModal" type="button">বন্ধ করুন</button>
                    <button id="logoutBtn" class="primary-btn" style="background:#ef4444;" type="button">লগআউট</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Toast Message -->
    <div id="toast" class="toast"></div>


    <!-- ================= SCRIPTS ================= -->

    <!-- Main JavaScript Module -->
    <script type="module" src="js/app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js")
                    .then((reg) => console.log("Service Worker Registered!", reg))
                    .catch((err) => console.log("Service Worker Registration Failed:", err));
            });
        }
    </script>
</body>
</html>
