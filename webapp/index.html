<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Data Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body.dark-mode { background-color: #121212 !important; color: #ffffff !important; --card-bg: #1e1e1e; }
        body.dark-mode .topbar, body.dark-mode .modal-content, body.dark-mode .category-card { background-color: #1e1e1e !important; color: #ffffff !important; border-color: #333333 !important; }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select { background-color: #2a2a2a !important; color: #ffffff !important; border-color: #444444 !important; }
        body.dark-mode .secondary-btn { background-color: #333333 !important; color: #ffffff !important; }
    </style>
</head>
<body>
<header class="topbar">
    <button id="menuBtn" class="icon-btn">☰</button>
    <div class="app-title"><span>📚</span> <span>My Data Manager</span></div>
    <div class="top-actions">
        <button id="themeBtn" class="icon-btn">🌙</button>
        <button id="searchBtn" class="icon-btn">🔍</button>
        <button id="logoutBtn" class="icon-btn">🚪</button>
    </div>
</header>
<main class="container">
    <section id="searchBox" class="search-box hidden">
        <input type="search" id="searchInput" placeholder="Category, Header অথবা Data খুঁজুন..." autocomplete="off">
        <button id="clearSearch">✕</button>
    </section>
    <div id="mainDashboardView">
        <section class="dashboard-header">
            <div><h1>আমার Categories</h1><p id="categoryCount">0টি Category</p></div>
            <button id="addCategoryBtn" class="primary-btn">＋ Category</button>
        </section>
        <section id="categoryList" class="category-list"></section>
        <section id="emptyState" class="empty-state">
            <div class="empty-icon">📂</div>
            <h2>এখনো কোনো Category নেই</h2>
            <button id="emptyAddBtn" class="primary-btn">＋ প্রথম Category তৈরি করুন</button>
        </section>
    </div>
    <div id="categoryDetailsView" class="hidden">
        <section class="dashboard-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="backToMainBtn" class="secondary-btn">← ব্যাকে যান</button>
                <div><h1 id="detailsTitle">Category</h1><p id="detailsSubtitle"></p></div>
            </div>
        </section>
        <div class="section-toolbar" style="margin-bottom: 20px;">
            <button id="addSubCategoryBtn" class="primary-btn">＋ Sub-Category</button>
            <button id="addHeaderBtn" class="primary-btn">＋ Header</button>
            <button id="addDataBtn" class="secondary-btn">＋ Data</button>
        </div>
        <div id="detailsContent"></div>
    </div>
</main>
<!-- Modals (Category, Header, Data, Move) -->
<div id="categoryModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2 id="categoryModalTitle">নতুন Category</h2><button class="close-btn" data-close="categoryModal">✕</button></div><div class="form-group"><label>Category Name</label><input id="categoryNameInput" type="text" maxlength="100"></div><div class="modal-actions"><button class="secondary-btn" data-close="categoryModal">বাতিল</button><button id="saveCategoryBtn" class="primary-btn">Save</button></div></div></div>
<div id="headerModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2>নতুন Header</h2><button class="close-btn" data-close="headerModal">✕</button></div><div class="form-group"><label>Header Name</label><input id="headerNameInput" type="text" maxlength="100"></div><div class="modal-actions"><button class="secondary-btn" data-close="headerModal">বাতিল</button><button id="saveHeaderBtn" class="primary-btn">Save</button></div></div></div>
<div id="dataModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2>নতুন Data</h2><button class="close-btn" data-close="dataModal">✕</button></div><div class="form-group"><label>Data Title</label><input id="dataTitleInput" type="text" maxlength="150"></div><div class="form-group"><label>বিবরণ</label><textarea id="dataDescriptionInput" rows="5"></textarea></div><div class="form-group"><label>Header</label><select id="dataHeaderSelect"><option value="">Header ছাড়া</option></select></div><div class="modal-actions"><button class="secondary-btn" data-close="dataModal">বাতিল</button><button id="saveDataBtn" class="primary-btn">Save</button></div></div></div>
<div id="moveDataModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2>Data সরান</h2><button class="close-btn" data-close="moveDataModal">✕</button></div><div class="form-group"><label>গন্তব্য Category</label><select id="moveCategorySelect"></select></div><div class="form-group"><label>গন্তব্য Header</label><select id="moveHeaderSelect"></select></div><div class="modal-actions"><button class="secondary-btn" data-close="moveDataModal">বাতিল</button><button id="confirmMoveBtn" class="primary-btn">Move করুন</button></div></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
