<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Data Manager</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body.dark-mode {
            background-color: #121212 !important;
            color: #ffffff !important;
            --card-bg: #1e1e1e;
        }
        body.dark-mode .topbar,
        body.dark-mode .modal-content,
        body.dark-mode .category-card {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border-color: #333333 !important;
        }
        body.dark-mode input,
        body.dark-mode textarea,
        body.dark-mode select {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
        body.dark-mode .secondary-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
        }
    </style>
</head>

<body>

<header class="topbar">

    <button id="menuBtn" class="icon-btn hidden" title="Menu">
        ☰
    </button>

    <div class="app-title">
        📁 My Data Manager
    </div>

    <div class="top-actions">
        <button id="adminLoginBtn" class="icon-btn" title="Admin Login">
            🔑 Admin Login
        </button>

        <button id="toggleSearchBtn" class="icon-btn" title="Search">
            🔍
        </button>
    </div>

</header>


<main class="container">

    <div id="searchBox" class="search-box hidden">

        <input type="text" id="searchInput" placeholder="Search categories & headers...">

        <button id="clearSearchBtn" title="Clear">
            ✕
        </button>

    </div>


    <div class="dashboard-header">

        <div>
            <h1 id="pageTitle">
                Dashboard
            </h1>
            <p id="pageSubTitle">
                Categories
            </p>
        </div>

        <button id="addCategoryBtn" class="primary-btn hidden">
            + New Category
        </button>

    </div>


    <div id="categoryContainer" class="category-list"></div>

</main>


<div id="loginModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Admin Login</h2>
            <button class="close-btn" data-close="loginModal">✕</button>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password">
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="loginModal">বাতিল</button>
            <button id="submitLoginBtn" class="primary-btn">Login</button>
        </div>

    </div>

</div>


<div id="categoryModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="categoryModalTitle">
                Category তৈরি করুন
            </h2>

            <button class="close-btn" data-close="categoryModal">
                ✕
            </button>
        </div>

        <div class="form-group">

            <label>
                Category Title
            </label>

            <input type="text" id="categoryTitle" placeholder="Category নাম দিন">

        </div>

        <div class="form-group">

            <label>
                Parent Category (Optional)
            </label>

            <select id="parentCategorySelect">
                <option value="">
                    Root Category
                </option>
            </select>

        </div>

        <div class="modal-actions">

            <button class="secondary-btn" data-close="categoryModal">
                বাতিল
            </button>

            <button id="saveCategoryBtn" class="primary-btn">
                Save
            </button>

        </div>

    </div>

</div>


<div id="headerModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="headerModalTitle">
                Header তৈরি করুন
            </h2>

            <button class="close-btn" data-close="headerModal">
                ✕
            </button>
        </div>

        <div class="form-group">

            <label>
                Header Title
            </label>

            <input type="text" id="headerTitleInput" placeholder="Header নাম দিন">

        </div>

        <div class="modal-actions">

            <button class="secondary-btn" data-close="headerModal">
                বাতিল
            </button>

            <button id="saveHeaderBtn" class="primary-btn">
                Save
            </button>

        </div>

    </div>

</div>


<div id="dataModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="dataModalTitle">
                Data যোগ করুন
            </h2>

            <button class="close-btn" data-close="dataModal">
                ✕
            </button>

        </div>

        <div class="form-group">
            <label>নাম</label>
            <input type="text" id="dataName" placeholder="নাম লিখুন">
        </div>

        <div class="form-group">
            <label>পদবী</label>
            <input type="text" id="dataDesignation" placeholder="পদবী লিখুন">
        </div>

        <div class="form-group">
            <label>মোবাইল</label>
            <input type="text" id="dataMobile" placeholder="মোবাইল নম্বর লিখুন">
        </div>

        <div class="form-group">
            <label>টেলিফোন</label>
            <input type="text" id="dataPhone" placeholder="টেলিফোন নম্বর লিখুন">
        </div>

        <div class="form-group">
            <label>ই-মেইল</label>
            <input type="email" id="dataEmail" placeholder="ই-মেইল ঠিকানা লিখুন">
        </div>

        <div class="form-group">
            <label>বর্তমানে কর্মরত</label>
            <input type="text" id="dataCurrentOffice" placeholder="বর্তমান কর্মস্থল লিখুন">
        </div>

        <div class="form-group">
            <label>স্থায়ী ঠিকানা</label>
            <textarea id="dataPermanentAddress" rows="2" placeholder="স্থায়ী ঠিকানা লিখুন"></textarea>
        </div>

        <div class="form-group">
            <label>প্রশাসনিক তথ্য</label>
            <textarea id="dataAdminInfo" rows="2" placeholder="প্রশাসনিক তথ্য লিখুন"></textarea>
        </div>

        <div class="form-group">
            <label>Header</label>
            <select id="dataHeaderSelect">
                <option value="">Header ছাড়া</option>
            </select>
        </div>

        <div class="modal-actions">

            <button class="secondary-btn" data-close="dataModal">
                বাতিল
            </button>

            <button id="saveDataBtn" class="primary-btn">
                Save
            </button>

        </div>

    </div>

</div>


<div id="moveDataModal" class="modal hidden">
    <div class="modal-content">

        <div class="modal-header">
            <h2>Data সরান (Move Data)</h2>
            <button class="close-btn" data-close="moveDataModal">✕</button>
        </div>

        <div class="form-group">
            <label>গন্তব্য Category বেছে নিন</label>
            <select id="moveCategorySelect"></select>
        </div>

        <div class="form-group">
            <label>গন্তব্য Header বেছে নিন</label>
            <select id="moveHeaderSelect"></select>
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" data-close="moveDataModal">বাতিল</button>
            <button id="confirmMoveBtn" class="primary-btn">Move করুন</button>
        </div>

    </div>
</div>


<div id="toast" class="toast"></div>


<script type="module" src="js/app.js"></script>

</body>
</html>
