<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Police Phonebook"
    >

    <title>Police Phonebook</title>

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- PWA Icon -->
    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css?v=3"
    >

    <!-- Firebase Compat Scripts (অফলাইন কাজ করার জন্য প্রয়োজনীয়) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>

<body>

<header class="topbar">

    <button
        id="menuBtn"
        class="icon-btn"
        type="button"
    >
        ☰
    </button>

    <div class="app-title">
        <span class="app-title-text">
            Police Phonebook
        </span>
    </div>

    <div class="top-actions">

        <button
            id="adminLoginBtn"
            class="primary-btn active-btn btn-admin-small"
            type="button"
        >
            🔑 Admin
        </button>

        <button
            id="themeBtn"
            class="icon-btn"
            title="নাইট/ডে মোড"
            type="button"
        >
            🌙
        </button>

        <button
            id="searchBtn"
            class="icon-btn"
            title="সার্চ করুন"
            type="button"
        >
            🔍
        </button>

    </div>

</header>


<main class="container">

    <!-- =========================
         Search Box
    ========================== -->

    <section
        id="searchBox"
        class="search-box hidden"
    >

        <input
            type="search"
            id="searchInput"
            placeholder="Category, Header অথবা Data খুঁজুন..."
            autocomplete="off"
        >

        <button
            id="clearSearch"
            type="button"
        >
            ✕
        </button>

    </section>


    <!-- =========================
         Page 1: Main Dashboard
    ========================== -->

    <div id="mainDashboardView">

        <section class="dashboard-header">

            <div>

                <h1>
                    আমার Categories
                </h1>

                <p id="categoryCount">
                    0টি Category
                </p>

            </div>

            <button
                id="addCategoryBtn"
                class="primary-btn admin-only"
                type="button"
            >
                ＋ Category
            </button>

        </section>


        <!-- Categories List -->

        <section
            id="categoryList"
            class="category-list"
        ></section>


        <!-- Empty State -->

        <section
            id="emptyState"
            class="empty-state hidden"
        >

            <div class="empty-icon">
                📂
            </div>

            <h2>
                এখনো কোনো Category নেই
            </h2>

            <p>
                ডাটা দেখতে অপেক্ষা করুন, প্রয়োজনে রিফ্রেস করুন।
            </p>

            <button
                id="emptyAddBtn"
                class="primary-btn admin-only"
                type="button"
            >
                ＋ প্রথম Category তৈরি করুন
            </button>

        </section>

    </div>


    <!-- =========================
         Page 2: Category Details
    ========================== -->

    <div
        id="categoryDetailsView"
        class="hidden"
    >

        <section class="dashboard-header">

            <div class="header-left">

                <button
                    id="backToMainBtn"
                    class="secondary-btn"
                    type="button"
                >
                    ← পেছনে যান
                </button>

                <div>

                    <h1 id="detailsTitle">
                        Category
                    </h1>

                    <p id="detailsSubtitle"></p>

                </div>

            </div>

        </section>


        <!-- Admin Toolbar -->

        <div class="section-toolbar admin-only">

            <button
                id="addSubCategoryBtn"
                class="primary-btn"
                type="button"
            >
                ＋ Sub-Category
            </button>

            <button
                id="addHeaderBtn"
                class="primary-btn"
                type="button"
            >
                ＋ Header
            </button>

            <button
                id="addDataBtn"
                class="secondary-btn"
                type="button"
            >
                ＋ Data
            </button>

        </div>


        <!-- Category Details -->

        <div id="detailsContent"></div>

    </div>


    <!-- =========================
         Page 3: Data Details
    ========================== -->

    <div
        id="dataDetailsView"
        class="hidden"
    >

        <section class="dashboard-header">

            <button
                id="backFromDataBtn"
                class="secondary-btn"
                type="button"
            >
                ← পেছনে যান
            </button>

        </section>


        <div class="details-container-card">

            <div id="dataPageContent"></div>

        </div>

    </div>

</main>


<!-- =========================
     Admin Login Modal
========================== -->

<div
    id="loginModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Admin Login
            </h2>

            <button
                class="close-btn"
                data-close="loginModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <div id="loginFormContainer">

            <div class="form-group">

                <label>
                    ইমেইল
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="admin@example.com"
                >

            </div>


            <div class="form-group">

                <label>
                    পাসওয়ার্ড
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="******"
                >

            </div>


            <div class="modal-actions">

                <button
                    class="secondary-btn"
                    data-close="loginModal"
                    type="button"
                >
                    বাতিল
                </button>

                <button
                    id="submitLoginBtn"
                    class="primary-btn"
                    type="button"
                >
                    লগইন
                </button>

            </div>

        </div>


        <!-- Logout -->

        <div
            id="logoutContainer"
            class="hidden logout-box"
        >

            <p class="status-ok">
                ✅ আপনি অ্যাডমিন হিসেবে লগইন আছেন
            </p>

            <div class="modal-actions">

                <button
                    class="secondary-btn"
                    data-close="loginModal"
                    type="button"
                >
                    বাতিল
                </button>

                <button
                    id="logoutBtn"
                    class="danger-btn"
                    type="button"
                >
                    🚪 লগআউট
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     Category Modal
========================== -->

<div
    id="categoryModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="categoryModalTitle">
                নতুন Category
            </h2>

            <button
                class="close-btn"
                data-close="categoryModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <div class="form-group">

            <label>
                Category Name
            </label>

            <input
                id="categoryNameInput"
                type="text"
                placeholder="যেমন: পুলিশ কর্মকর্তা"
                maxlength="100"
            >

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                data-close="categoryModal"
                type="button"
            >
                বাতিল
            </button>

            <button
                id="saveCategoryBtn"
                class="primary-btn"
                type="button"
            >
                Save
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Header Modal
========================== -->

<div
    id="headerModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                নতুন Header
            </h2>

            <button
                class="close-btn"
                data-close="headerModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <div class="form-group">

            <label>
                Header Name
            </label>

            <input
                id="headerNameInput"
                type="text"
                placeholder="যেমন: জরুরি যোগাযোগ"
                maxlength="100"
            >

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                data-close="headerModal"
                type="button"
            >
                বাতিল
            </button>

            <button
                id="saveHeaderBtn"
                class="primary-btn"
                type="button"
            >
                Save
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Data Modal
========================== -->

<div
    id="dataModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="dataModalTitle">
                Data যোগ করুন
            </h2>

            <button
                class="close-btn"
                data-close="dataModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <div class="form-group">

            <label>
                ছবি (URL)
            </label>

            <input
                type="url"
                id="dataPhoto"
                placeholder="https://example.com/photo.jpg"
            >

        </div>


        <div class="form-group">

            <label>
                নাম
            </label>

            <input
                type="text"
                id="dataName"
                placeholder="নাম লিখুন"
            >

        </div>


        <div class="form-group">

            <label>
                মোবাইল
            </label>

            <input
                type="text"
                id="dataMobile"
                placeholder="মোবাইল নম্বর"
            >

        </div>


        <div class="form-group">

            <label>
                টেলিফোন
            </label>

            <input
                type="text"
                id="dataPhone"
                placeholder="টেলিফোন নম্বর"
            >

        </div>


        <div class="form-group">

            <label>
                পদবী
            </label>

            <input
                type="text"
                id="dataDesignation"
                placeholder="পদবী লিখুন"
            >

        </div>


        <div class="form-group">

            <label>
                ই-মেইল
            </label>

            <input
                type="email"
                id="dataEmail"
                placeholder="ই-মেইল ঠিকানা"
            >

        </div>


        <div class="form-group">

            <label>
                বর্তমান কর্মস্থল
            </label>

            <input
                type="text"
                id="dataCurrentOffice"
                placeholder="বর্তমান ঠিকানা / কর্মস্থল"
            >

        </div>


        <div class="form-group">

            <label>
                স্থায়ী ঠিকানা
            </label>

            <textarea
                id="dataPermanentAddress"
                rows="2"
                placeholder="স্থায়ী ঠিকানা"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                প্রশাসনিক তথ্য
            </label>

            <textarea
                id="dataAdminInfo"
                rows="2"
                placeholder="প্রশাসনিক তথ্য"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Header
            </label>

            <select id="dataHeaderSelect">

                <option value="">
                    Header ছাড়া
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                data-close="dataModal"
                type="button"
            >
                বাতিল
            </button>

            <button
                id="saveDataBtn"
                class="primary-btn"
                type="button"
            >
                Save
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Move Data Modal
========================== -->

<div
    id="moveDataModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Data সরান (Move Data)
            </h2>

            <button
                class="close-btn"
                data-close="moveDataModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <div class="form-group">

            <label>
                গন্তব্য Category
            </label>

            <select id="moveCategorySelect"></select>

        </div>


        <div class="form-group">

            <label>
                গন্তব্য Header
            </label>

            <select id="moveHeaderSelect"></select>

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                data-close="moveDataModal"
                type="button"
            >
                বাতিল
            </button>

            <button
                id="confirmMoveBtn"
                class="primary-btn"
                type="button"
            >
                Move করুন
            </button>

        </div>

    </div>

</div>


<!-- Toast -->

<div
    id="toast"
    class="toast"
></div>


<!-- JavaScript -->

<script
    type="module"
    src="js/app.js"
></script>


<!-- =========================
     PWA Service Worker
========================== -->

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker
            .register("./sw.js")
            .then(function (registration) {
                console.log(
                    "PWA Service Worker registered:",
                    registration.scope
                );
            })
            .catch(function (error) {
                console.error(
                    "Service Worker registration failed:",
                    error
                );
            });
    });
}
</script>

</body>
</html>
