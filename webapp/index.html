<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Data Manager</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        /* জরুরি UI ও নাইট/ডে মোডের CSS রুলস */
        .hidden {
            display: none !important;
        }
        
        /* Dark Mode Global Overrides */
        body.dark-mode {
            background-color: #121212 !important;
            color: #ffffff !important;
            --card-bg: #1e1e1e;
        }
        body.dark-mode .topbar,
        body.dark-mode .modal-content,
        body.dark-mode .category-card {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border-color: #333333 !important;
        }
        body.dark-mode input,
        body.dark-mode textarea,
        body.dark-mode select {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
        body.dark-mode .secondary-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
        }
        
        /* Modals & Overlay CSS */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal.hidden { display: none !important; }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 8px;
            width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .primary-btn { background: #0066cc; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .secondary-btn { background: #e0e0e0; color: #333; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .danger-btn { background-color: #dc3545 !important; color: white !important; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>

<body>

<header class="topbar" style="display:flex; justify-content:space-between; align-items:center; padding: 10px 15px;">
    <div style="display:flex; align-items:center; gap: 10px;">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div class="app-title">
            <span>📚 My Data Manager</span>
        </div>
    </div>

    <div class="top-actions" style="display: flex; gap: 8px; align-items: center;">
        <button id="adminLoginBtn" class="primary-btn" style="padding: 6px 12px; font-size: 13px;">
            🔑 Admin Login
        </button>
        <button id="themeBtn" class="icon-btn" title="নাইট/ডে মোড" style="cursor:pointer;">🌙</button>
        <button id="searchBtn" class="icon-btn" title="সার্চ করুন" style="cursor:pointer;">🔍</button>
    </div>
</header>

<main class="container" style="padding: 15px;">

    <!-- Search Box -->
    <section id="searchBox" class="search-box hidden" style="margin-bottom:15px;">
        <input type="search" id="searchInput" placeholder="Category, Header অথবা Data খুঁজুন..." autocomplete="off">
        <button id="clearSearch">✕</button>
    </section>

    <!-- Main View -->
    <div id="mainDashboardView">
        <section class="dashboard-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
                <h1 style="margin:0;">আমার Categories</h1>
                <p id="categoryCount" style="margin:0; color:gray;">0টি Category</p>
            </div>

            <button id="addCategoryBtn" class="primary-btn admin-only hidden">
                ＋ Category
            </button>
        </section>

        <section id="categoryList" class="category-list"></section>

        <section id="emptyState" class="empty-state" style="text-align:center; padding:40px 0;">
            <div class="empty-icon" style="font-size:40px;">📂</div>
            <h2>এখনো কোনো Category নেই</h2>
            <p>ডাটা দেখতে অপেক্ষা করুন অথবা এডমিন হিসেবে লগইন করুন।</p>
            <button id="emptyAddBtn" class="primary-btn admin-only hidden">
                ＋ প্রথম Category তৈরি করুন
            </button>
        </section>
    </div>

    <!-- Category Details View -->
    <div id="categoryDetailsView" class="hidden">
        <section class="dashboard-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="backToMainBtn" class="secondary-btn">← ব্যাকে যান</button>
                <div>
                    <h1 id="detailsTitle" style="margin:0;">Category</h1>
                    <p id="detailsSubtitle" style="margin:0; color:gray;"></p>
                </div>
            </div>
        </section>

        <div class="section-toolbar admin-only hidden" style="margin: 15px 0;">
            <button id="addSubCategoryBtn" class="primary-btn">＋ Sub-Category</button>
            <button id="addHeaderBtn" class="primary-btn">＋ Header</button>
            <button id="addDataBtn" class="secondary-btn">＋ Data</button>
        </div>

        <div id="detailsContent"></div>
    </div>

</main>

<!-- Admin Login Modal -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0;">Admin Login</h2>
            <button class="close-btn" data-close="loginModal" style="background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div class="form-group">
            <label>ইমেইল</label>
            <input id="loginEmail" type="email" placeholder="admin@example.com">
        </div>

        <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input id="loginPassword" type="password" placeholder="******">
        </div>

        <div class="modal-actions" style="display: flex; flex-direction: column; gap: 8px;">
            <button id="submitLoginBtn" class="primary-btn" style="width: 100%;">লগইন</button>
            <button id="modalLogoutBtn" class="danger-btn admin-only hidden" style="width: 100%;">🚪 লগআউট করুন</button>
            <button class="secondary-btn" data-close="loginModal" style="width: 100%;">বাতিল</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:20px; display:none;"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
