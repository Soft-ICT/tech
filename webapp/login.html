<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My Data Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            📚
        </div>

        <h1>My Data Manager</h1>

        <p class="auth-subtitle">
            আপনার Account-এ Login করুন
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="আপনার Email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="আপনার Password"
                    required
                >

            </div>


            <p
                id="loginError"
                class="auth-error"
            ></p>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Account নেই?

            <a href="register.html">
                Register করুন
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="js/login.js"
></script>

</body>

</html>
