<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        .splash-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .splash-title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 24px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="splash-icon">🚓</div>
        <h1 class="splash-title">Police Phonebook</h1>
        <div class="spinner"></div>
    </div>

    <script>
        // ২ সেকেন্ড (2000ms) পর আসল ফাইল index.html এ চলে যাবে
        setTimeout(() => {
            window.location.href = "index.html"; 
        }, 2000);
    </script>
</body>
</html>
