<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook - Loading</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            overflow: hidden;
        }

        /* ==========================================
           ULTRA PREMIUM SPLASH SCREEN
        ========================================== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        /* সাইরেন নেবুলা গ্লো */
        .siren-glow-red {
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(239, 68, 68, 0.18);
            border-radius: 50%;
            filter: blur(100px);
            top: 25%;
            left: 20%;
            animation: pulseRed 2s infinite alternate ease-in-out;
        }

        .siren-glow-blue {
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(37, 99, 235, 0.25);
            border-radius: 50%;
            filter: blur(100px);
            bottom: 25%;
            right: 20%;
            animation: pulseBlue 2s infinite alternate ease-in-out 1s;
        }

        /* ৩D গ্লাস কার্ড */
        .premium-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 45px 35px;
            text-align: center;
            max-width: 380px;
            width: 88%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        /* ব্যাজ অ্যানিমেশন */
        .shield-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 28px;
            perspective: 1000px;
        }

        .shield-icon {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 12px 20px rgba(37, 99, 235, 0.4));
            animation: float3D 3.5s ease-in-out infinite;
        }

        .gold-ring {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: #f59e0b;
            border-bottom-color: #3b82f6;
            animation: rotateRing 4s linear infinite;
        }

        .splash-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* প্রোগ্রেস লোডার */
        .loader-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #60a5fa);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: fillProgress 3.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* ANIMATION KEYFRAMES */
        @keyframes float3D {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(12deg); }
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseRed {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 0.6; transform: scale(1.1); }
        }

        @keyframes pulseBlue {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1.15); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Start -->
    <div id="splash-screen">
        <div class="siren-glow-red"></div>
        <div class="siren-glow-blue"></div>

        <div class="premium-card">
            <div class="shield-container">
                <div class="gold-ring"></div>
                <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="url(#shield-grad)" stroke="url(#border-grad)" stroke-width="1.2"/>
                    <path d="M12 6L13.5 9.5H17L14 11.8L15.2 15.3L12 13L8.8 15.3L10 11.8L7 9.5H10.5L12 6Z" fill="url(#star-grad)"/>
                    <defs>
                        <linearGradient id="shield-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#1e3a8a"/>
                            <stop offset="0.5" stop-color="#0f172a"/>
                            <stop offset="1" stop-color="#020617"/>
                        </linearGradient>
                        <linearGradient id="border-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#93c5fd"/>
                            <stop offset="1" stop-color="#1d4ed8"/>
                        </linearGradient>
                        <linearGradient id="star-grad" x1="7" y1="6" x2="17" y2="15.3" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fef08a"/>
                            <stop offset="1" stop-color="#f59e0b"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h1 class="splash-title">Police Phonebook</h1>
            <p class="splash-subtitle">Bangladesh Police</p>

            <div class="loader-bar-bg">
                <div class="loader-bar-fill"></div>
            </div>
        </div>
    </div>
    <!-- Splash Screen End -->

    <!-- JavaScript Redirect Code -->
    <script>
        window.addEventListener('load', function() {
            // ৩.২ সেকেন্ড (3200ms) পর পরবর্তী পেজ `index.html` ওপেন হবে
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('fade-out');
                }
                
                // নেক্সট পেজ এ রিডাইরেক্ট করার কোড
                setTimeout(function() {
                    window.location.href = "index.html"; 
                }, 600); // ফেড-আউট ইফেক্ট শেষ হওয়ার পর পেজ রিডাইরেক্ট হবে

            }, 3200);
        });
    </script>
</body>
</html>
