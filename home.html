<style>
    #passwordGate {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
    }

    #passwordGate.hidden {
        display: none;
    }

    .password-box {
        width: 100%;
        max-width: 380px;

        background: #fff;
        border-radius: 18px;

        padding: 28px 22px;

        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.25);

        text-align: center;
    }

    .password-icon {
        width: 64px;
        height: 64px;

        margin: 0 auto 16px;

        border-radius: 50%;

        background: #e7f1ff;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
    }

    .password-box h2 {
        margin-bottom: 8px;

        font-size: 21px;
        color: #212529;
    }

    .password-box p {
        margin-bottom: 20px;

        font-size: 14px;
        line-height: 1.5;

        color: #6c757d;
    }

    .password-input {
        width: 100%;

        height: 48px;

        padding: 0 14px;

        border: 1px solid #ced4da;
        border-radius: 10px;

        outline: none;

        font-size: 16px;

        text-align: center;
    }

    .password-input:focus {
        border-color: #0d6efd;

        box-shadow:
            0 0 0 3px rgba(13, 110, 253, 0.12);
    }

    .password-button {
        width: 100%;

        height: 48px;

        margin-top: 14px;

        border: 0;
        border-radius: 10px;

        background: #0d6efd;
        color: white;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;
    }

    .password-button:active {
        transform: scale(0.98);
    }

    .password-error {
        min-height: 21px;

        margin-top: 10px;

        font-size: 13px;

        color: #dc3545;
    }

    @media (prefers-color-scheme: dark) {
        .password-box {
            background: #1e1e1e;
        }

        .password-box h2 {
            color: #fff;
        }

        .password-box p {
            color: #adb5bd;
        }

        .password-input {
            background: #2b2b2b;
            color: #fff;
            border-color: #444;
        }

        .password-icon {
            background: #263d5c;
        }
    }
</style>


<div id="passwordGate">

    <div class="password-box">

        <div class="password-icon">
            🔐
        </div>

        <h2 id="passwordTitle">
            নিরাপত্তা যাচাই
        </h2>

        <p id="passwordMessage">
            অ্যাপে প্রবেশ করতে আপনার পাসওয়ার্ড দিন।
        </p>

        <input
            type="password"
            id="appPassword"
            class="password-input"
            autocomplete="off"
            placeholder="পাসওয়ার্ড"
        >

        <button
            type="button"
            id="passwordButton"
            class="password-button">
            প্রবেশ করুন
        </button>

        <div
            id="passwordError"
            class="password-error">
        </div>

    </div>

</div>


<script>
(function () {

    const STORAGE_KEY = "police_phonebook_password_hash";

    const gate = document.getElementById("passwordGate");
    const input = document.getElementById("appPassword");
    const button = document.getElementById("passwordButton");
    const error = document.getElementById("passwordError");

    const title = document.getElementById("passwordTitle");
    const message = document.getElementById("passwordMessage");


    // SHA-256 hash তৈরি
    async function sha256(text) {

        const encoder = new TextEncoder();

        const data = encoder.encode(text);

        const hashBuffer =
            await crypto.subtle.digest("SHA-256", data);

        const hashArray =
            Array.from(new Uint8Array(hashBuffer));

        return hashArray
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }


    // Password আগে সেট করা আছে কি না
    const savedHash =
        localStorage.getItem(STORAGE_KEY);


    if (!savedHash) {

        title.textContent =
            "প্রথমবারের সেটআপ";

        message.textContent =
            "অ্যাপটি সুরক্ষিত করতে একটি নতুন পাসওয়ার্ড সেট করুন।";

        input.placeholder =
            "নতুন পাসওয়ার্ড";

        button.textContent =
            "পাসওয়ার্ড সেট করুন";
    }


    async function checkPassword() {

        const password =
            input.value.trim();

        error.textContent = "";


        if (!password) {

            error.textContent =
                "পাসওয়ার্ড দিন।";

            input.focus();

            return;
        }


        // প্রথমবারের Setup
        if (!savedHash) {

            if (password.length < 4) {

                error.textContent =
                    "পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে।";

                return;
            }


            const hash =
                await sha256(password);


            localStorage.setItem(
                STORAGE_KEY,
                hash
            );


            // Setup শেষ হলে অ্যাপে প্রবেশ
            gate.classList.add("hidden");

            return;
        }


        // পরবর্তীতে Password যাচাই
        const enteredHash =
            await sha256(password);


        if (enteredHash === savedHash) {

            gate.classList.add("hidden");

        } else {

            error.textContent =
                "ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।";

            input.value = "";

            input.focus();
        }
    }


    button.addEventListener(
        "click",
        checkPassword
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                checkPassword();
            }

        }
    );


    // Dialog খোলা থাকা অবস্থায় background app ব্যবহার আটকানো
    document.body.style.overflow = "hidden";


    const observer =
        new MutationObserver(() => {

            if (gate.classList.contains("hidden")) {
                document.body.style.overflow = "";
            }

        });


    observer.observe(gate, {
        attributes: true,
        attributeFilter: ["class"]
    });


})();
</script>
