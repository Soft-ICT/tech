<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Police Phonebook">

    <title>Police Phonebook</title>

    <link rel="manifest" href="manifest.json?v=1.1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=6">

    <style>
        body.app-locked {
            overflow: hidden !important;
        }
        #appContainer {
            visibility: hidden;
        }
        #appContainer.app-unlocked {
            visibility: visible;
        }
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: var(--splash-bg, #f8fafc);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 1000000;
            opacity: 1; visibility: visible;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        #splash-screen.fade-out {
            opacity: 0; visibility: hidden;
        }
        :root {
            --splash-bg: #f8fafc;
            --splash-text: #0f172a;
            --splash-secondary: #0284c7;
            --splash-red: rgba(239, 68, 68, 0.12);
            --splash-blue: rgba(37, 99, 235, 0.15);
            --splash-loader: rgba(15, 23, 42, 0.08);
        }
        body.dark-mode {
            --splash-bg: #030712;
            --splash-text: #ffffff;
            --splash-secondary: #38bdf8;
            --splash-red: rgba(239, 68, 68, 0.25);
            --splash-blue: rgba(37, 99, 235, 0.3);
            --splash-loader: rgba(255, 255, 255, 0.1);
        }
        .siren-glow-red {
            position: absolute; width: 60vw; height: 60vw;
            max-width: 500px; max-height: 500px;
            background: var(--splash-red); border-radius: 50%;
            filter: blur(120px); top: 15%; left: 10%;
            animation: pulseRed 2.5s infinite alternate ease-in-out;
        }
        .siren-glow-blue {
            position: absolute; width: 60vw; height: 60vw;
            max-width: 500px; max-height: 500px;
            background: var(--splash-blue); border-radius: 50%;
            filter: blur(120px); bottom: 15%; right: 10%;
            animation: pulseBlue 2.5s infinite alternate ease-in-out 1.2s;
        }
        .splash-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; width: 85%; max-width: 320px;
        }
        .shield-container {
            position: relative; width: 110px; height: 110px; margin-bottom: 24px;
        }
        .shield-icon {
            width: 100%; height: 100%;
            filter: drop-shadow(0 12px 24px rgba(37, 99, 235, 0.35));
            animation: floatShield 3s ease-in-out infinite;
        }
        .gold-ring {
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%; border: 2px solid transparent;
            border-top-color: #f59e0b; border-bottom-color: #3b82f6;
            animation: rotateRing 3.5s linear infinite;
        }
        .splash-title { font-size: 26px; font-weight: 700; color: var(--splash-text); margin-bottom: 4px; }
        .splash-subtitle { font-size: 13px; color: var(--splash-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .loader-bar-bg { width: 100%; height: 4px; background: var(--splash-loader); border-radius: 10px; overflow: hidden; position: relative; }
        .loader-bar-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #06b6d4);
            border-radius: 10px; box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: fillProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        @keyframes floatShield { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseRed { 0% { opacity: 0.3; transform: scale(0.9); } 100% { opacity: 0.8; transform: scale(1.1); } }
        @keyframes pulseBlue { 0% { opacity: 0.3; transform: scale(0.9); } 100% { opacity: 0.8; transform: scale(1.1); } }
        @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }

        #passwordGate {
            position: fixed; inset: 0; z-index: 999999; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0, 0, 0, 0.58); backdrop-filter: blur(10px);
        }
        #passwordGate.show { display: flex; }
        .password-gate-box {
            width: 100%; max-width: 380px; background: var(--card-bg, #ffffff);
            color: var(--text-main, #212529); border-radius: 20px; padding: 28px 22px 24px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35); text-align: center;
        }
        .password-shield {
            width: 70px; height: 70px; margin: 0 auto 16px; border-radius: 50%;
            background: rgba(13, 110, 253, 0.10); display: flex; align-items: center; justify-content: center; font-size: 34px;
        }
        .password-field {
            width: 100%; height: 50px; padding: 0 15px; border: 1px solid var(--border-color, #ced4da);
            border-radius: 11px; background: var(--input-bg, #ffffff); color: var(--text-main, #212529);
            outline: none; font-size: 16px; text-align: center;
        }
        .password-error { min-height: 22px; margin-top: 9px; font-size: 13px; color: #dc3545; }
        .password-submit {
            width: 100%; height: 50px; margin-top: 4px; border: 0; border-radius: 11px;
            background: #0d6efd; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>

<body class="app-locked">

<div id="splash-screen">
    <div class="siren-glow-red"></div>
    <div class="siren-glow-blue"></div>
    <div class="splash-content">
        <div class="shield-container">
            <div class="gold-ring"></div>
            <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="url(#shield-grad)" stroke="url(#border-grad)" stroke-width="1.2"/>
                <path d="M12 6L13.5 9.5H17L14 11.8L15.2 15.3L12 13L8.8 15.3L10 11.8L7 9.5H10.5L12 6Z" fill="url(#star-grad)"/>
            </svg>
        </div>
        <h1 class="splash-title">Police Phonebook</h1>
        <p class="splash-subtitle">Bangladesh Police</p>
        <div class="loader-bar-bg"><div class="loader-bar-fill"></div></div>
    </div>
</div>

<div id="passwordGate">
    <div class="password-gate-box">
        <div class="password-shield">🔐</div>
        <h2 id="passwordGateTitle">নিরাপত্তা যাচাই</h2>
        <p id="passwordGateMessage">অ্যাপে প্রবেশ করতে আপনার পাসওয়ার্ড দিন।</p>
        <input id="appPassword" class="password-field" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড">
        <div id="passwordError" class="password-error"></div>
        <button id="passwordSubmit" class="password-submit" type="button">প্রবেশ করুন</button>
    </div>
</div>

<div id="appContainer">

<header class="topbar">
    <button id="navToggleBtn" class="icon-btn" type="button" title="মেনু">
        <span id="menuIcon">☰</span>
        <span id="backIcon" class="hidden">←</span>
    </button>

    <div class="app-title" id="appTitle">
        <span class="app-title-text">Police Phonebook</span>
        <span id="verifiedBadge" class="verified-badge hidden" title="Verified Device">✔</span>
    </div>

    <!-- ভাষা পরিবর্তনের রেডিও বাটন হেবারে যুক্ত করা হয়েছে -->
    <div id="langSwitchContainer" style="display: flex; align-items: center; gap: 8px; margin-right: 10px; font-size: 13px; font-weight: 600;">
        <label style="cursor: pointer;"><input type="radio" name="appLangRadio" value="bn" checked onclick="changeAppLanguage('bn')"> বাং</label>
        <label style="cursor: pointer;"><input type="radio" name="appLangRadio" value="en" onclick="changeAppLanguage('en')"> Eng</label>
    </div>

    <div id="searchBox" class="header-search-box hidden">
        <input type="search" id="searchInput" placeholder="Category, Header অথবা Data খুঁজুন..." autocomplete="off">
    </div>

    <div class="top-actions" id="topActions">
        <button id="adminLoginBtn" class="primary-btn active-btn btn-admin-small hidden" type="button">🔑 Admin</button>
        <button id="searchBtn" class="icon-btn" title="সার্চ করুন" type="button">🔍</button>
        <button id="themeBtn" class="icon-btn" title="নাইট/ডে মোড" type="button">🌙</button>
    </div>
</header>

<div class="sub-toolbar" id="allSearchBtn" style="cursor: pointer;" title="অল সার্চ অপশন">
    <div class="sub-toolbar-title">🌐 Search All Units & Numbers</div>
</div>

<main class="container">
    <div id="mainDashboardView">
        <section class="dashboard-header">
            <div id="adminActionContainer" class="admin-only hidden" style="display: flex; gap: 8px; width: 100%; margin-top: 8px;">
                <button id="addCategoryBtn" class="primary-btn" type="button" style="flex: 1;">＋ Category</button>
                <button id="notificationBtn" class="secondary-btn" type="button" style="flex: 1; position: relative;">🔔 নোটিফিকেশন</button>
            </div>
        </section>
        <section id="categoryList" class="category-list"></section>
        <div id="allSearchContainer" class="hidden" style="margin-top: 15px;"></div>
        <section id="emptyState" class="empty-state hidden">
            <div class="empty-icon">📂</div>
            <h2>এখনো কোনো Category নেই</h2>
            <p>ডাটা দেখতে অপেক্ষা করুন, প্রয়োজনে রিফ্রেস করুন।</p>
            <button id="emptyAddBtn" class="primary-btn admin-only hidden" type="button">＋ প্রথম Category তৈরি করুন</button>
        </section>
    </div>

    <div id="categoryDetailsView" class="hidden">
        <section class="dashboard-header">
            <div class="header-left">
                <div>
                    <h1 id="detailsTitle">Category</h1>
                    <p id="detailsSubtitle"></p>
                </div>
            </div>
        </section>
        <div class="section-toolbar admin-only hidden">
            <button id="addSubCategoryBtn" class="primary-btn" type="button">＋ Sub-Category</button>
            <button id="addHeaderBtn" class="primary-btn" type="button">＋ Header</button>
            <button id="addDataBtn" class="secondary-btn" type="button">＋ Data</button>
        </div>
        <div id="detailsContent"></div>
    </div>

    <div id="dataDetailsView" class="hidden">
        <div class="details-container-card">
            <div id="dataPageContent"></div>
        </div>
    </div>
</main>

<!-- Modals -->
<div id="loginModal" class="modal hidden">...</div>
<div id="verifyModal" class="modal hidden">...</div>
<div id="adminVerifyRequestsModal" class="modal hidden">...</div>
<div id="categoryModal" class="modal hidden">...</div>
<div id="headerModal" class="modal hidden">...</div>
<div id="dataModal" class="modal hidden">...</div>
<div id="moveDataModal" class="modal hidden">...</div>
<div id="customConfirmModal" class="modal hidden">...</div>
<div id="toast" class="toast"></div>

</div>

<script type="module" src="js/app.js"></script>
<script src="js/color-formatter.js"></script>
<script type="module" src="js/custom-settings.js"></script>
<script type="module">
    import { initDrawer } from './js/drawer.js';
    document.addEventListener("DOMContentLoaded", () => { initDrawer(); });
</script>
</body>
</html>
