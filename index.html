<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0d6efd">

    <title>Police Phonebook</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f8f9fa;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;
        }

        .logo svg {
            width: 90px;
            height: 90px;
        }

        .title {
            font-size: 25px;
            font-weight: 700;
            color: #212529;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 14px;
            color: #6c757d;
        }

        .loading {
            margin-top: 30px;

            width: 34px;
            height: 34px;

            border: 3px solid #dee2e6;
            border-top-color: #0d6efd;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #121212;
            }

            .title {
                color: #fff;
            }

            .subtitle {
                color: #adb5bd;
            }

            .loading {
                border-color: #343a40;
                border-top-color: #0d6efd;
            }
        }
    </style>
</head>

<body>

<div class="splash">

    <div class="logo">
        <svg viewBox="0 0 100 100"
             xmlns="http://www.w3.org/2000/svg">

            <circle cx="50"
                    cy="50"
                    r="46"
                    fill="#0d6efd"/>

            <path d="M50 18
                     L78 28
                     V48
                     C78 67 66 79 50 85
                     C34 79 22 67 22 48
                     V28 Z"
                  fill="white"/>

            <path d="M50 29
                     L70 36
                     V48
                     C70 61 62 70 50 76
                     C38 70 30 61 30 48
                     V36 Z"
                  fill="#0d6efd"/>

            <path d="M39 49
                     L46 56
                     L62 40"
                  fill="none"
                  stroke="white"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
    </div>

    <div class="title">
        Police Phonebook
    </div>

    <div class="subtitle">
        Bangladesh Police
    </div>

    <div class="loading"></div>

</div>

<script>
    setTimeout(() => {
        window.location.replace("./home.html");
    }, 1200);
</script>

</body>
</html>
