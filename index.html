<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook - Loading</title>

    <link rel="preload" href="index.html" as="document">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- Dynamic Theme Variables --- */
        :root {
            --bg-color: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #0284c7;
            --siren-red: rgba(239, 68, 68, 0.12);
            --siren-blue: rgba(37, 99, 235, 0.15);
            --loader-bg: rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #030712;
            --text-primary: #ffffff;
            --text-secondary: #38bdf8;
            --siren-red: rgba(239, 68, 68, 0.25);
            --siren-blue: rgba(37, 99, 235, 0.3);
            --loader-bg: rgba(255, 255, 255, 0.1);
        }

        /* --- Fullscreen Setup --- */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        /* --- Background Glows --- */
        .siren-glow-red {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: var(--siren-red);
            border-radius: 50%;
            filter: blur(120px);
            top: 15%;
            left: 10%;
            animation: pulseRed 2.5s infinite alternate ease-in-out;
        }

        .siren-glow-blue {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: var(--siren-blue);
            border-radius: 50%;
            filter: blur(120px);
            bottom: 15%;
            right: 10%;
            animation: pulseBlue 2.5s infinite alternate ease-in-out 1.2s;
        }

        /* --- Content Layout --- */
        .splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        .shield-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
        }

        .shield-icon {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 12px 24px rgba(37, 99, 235, 0.35));
            animation: float 3s ease-in-out infinite;
        }

        .gold-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #f59e0b;
            border-bottom-color: #3b82f6;
            animation: rotateRing 3.5s linear infinite;
        }

        .splash-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .loader-bar-bg {
            width: 100%;
            height: 4px;
            background: var(--loader-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #06b6d4);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: fillProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseRed {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes pulseBlue {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="siren-glow-red"></div>
        <div class="siren-glow-blue"></div>

        <div class="splash-content">
            <div class="shield-container">
                <div class="gold-ring"></div>
                <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="url(#shield-grad)" stroke="url(#border-grad)" stroke-width="1.2"/>
                    <path d="M12 6L13.5 9.5H17L14 11.8L15.2 15.3L12 13L8.8 15.3L10 11.8L7 9.5H10.5L12 6Z" fill="url(#star-grad)"/>
                    <defs>
                        <linearGradient id="shield-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#1e3a8a"/>
                            <stop offset="0.5" stop-color="#0f172a"/>
                            <stop offset="1" stop-color="#020617"/>
                        </linearGradient>
                        <linearGradient id="border-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#93c5fd"/>
                            <stop offset="1" stop-color="#1d4ed8"/>
                        </linearGradient>
                        <linearGradient id="star-grad" x1="7" y1="6" x2="17" y2="15.3" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fef08a"/>
                            <stop offset="1" stop-color="#f59e0b"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h1 class="splash-title">Police Phonebook</h1>
            <p class="splash-subtitle">Bangladesh Police</p>

            <div class="loader-bar-bg">
                <div class="loader-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // ১. অটোমেটিক থিম সেটআপ
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);

        // ২. রিডাইরেক্ট লজিক (১.৬ সেকেন্ড সময় যাতে ব্যবহারকারীকে বেশিক্ষণ না থামতে হয়)
        window.addEventListener('load', function() {
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('fade-out');

                setTimeout(function() {
                    // replace ব্যবহার করার কারণে ব্রাউজারের হিস্ট্রি তৈরি হবে না (Back মারলে আবার স্প্ল্যাশে ফিরবে না)
                    window.location.replace("home.html"); 
                }, 400);
            }, 1600);
        });
    </script>
</body>
</html>
